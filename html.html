<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajout d'un compte Asterisk</title>
</head>
<body>
  <form id="formulaire">
    <p>
      <label for="displayName">Nom d'affichage :</label>
      <input type="text" id="displayName" name="displayName" required>
    </p>
    <p>
      <label for="phoneNumber">Numéro du téléphone sur Asterisk (pas votre 06) :</label>
      <input type="text" id="phoneNumber" name="phoneNumber" required>
    </p>
    <p>
      <label for="username">Username :</label>
      <input type="text" id="username" name="username" required>
    </p>
    <p>
      <label for="password">Password :</label>
      <input type="password" id="password" name="password" required>
    </p>
    <p>
      <label for="maxContact">Max contact :</label>
      <input type="number" id="maxContact" name="maxContact" min="1" required>
    </p>
    <p>
      <button type="submit">Envoyer</button>
    </p>
  </form>

  <p id="resultat"></p>

  <script src="js.js"></script>
</body>
</html>
